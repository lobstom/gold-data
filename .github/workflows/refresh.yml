name: Refresh data
on:
  schedule:
    - cron: '17 4 * * 1'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Monday snapshot and legacy data.json (false = isolated test)'
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl xlrd
      - name: Validate snapshot logic against current legacy data
        run: python scripts/weekly_snapshot.py --self-test
      - name: Fetch, validate and freeze snapshot
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/weekly_snapshot.py --publish
          else
            python scripts/weekly_snapshot.py
          fi
      - name: Commit validated output
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json scripts/cameco.csv snapshots/
          git diff --cached --quiet || git commit -m "Weekly data snapshot"
          git pull --rebase
          git push
      - name: Failure notice
        if: failure()
        run: echo '::error::Weekly refresh failed. Last valid data and snapshot remain unchanged. Newsletter must label any prior snapshot explicitly.'
