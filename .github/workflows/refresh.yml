name: Refresh data
on:
  schedule:
    # GitHub cron is UTC-only; 12:30 UTC = 5:30 AM PDT / 4:30 AM PST Monday, ahead of the 6:25 AM PT report build
    - cron: '30 12 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Monday snapshot and legacy data.json (false = isolated test)'
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl xlrd
      - name: Validate snapshot logic against current legacy data
        run: python -u scripts/weekly_snapshot.py --self-test
      - name: Test row-specific freshness logic
        run: python -m unittest discover -s scripts -p test_freshness_report.py
      - name: Fetch, validate and freeze snapshot
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python -u scripts/weekly_snapshot.py --publish
          else
            python -u scripts/weekly_snapshot.py
          fi
      - name: Report effective-row observation vintages
        run: python scripts/freshness_report.py
      - name: Commit validated output
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json scripts/cameco.csv snapshots/ reports/
          git diff --cached --quiet || git commit -m "Weekly data snapshot"
          git pull --rebase
          git push
      - name: Failure notice
        if: failure()
        run: echo '::error::Weekly refresh failed. Last valid data and snapshot remain unchanged. Newsletter must label any prior snapshot explicitly.'
