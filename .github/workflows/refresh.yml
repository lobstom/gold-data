name: Refresh data
on:
  schedule: [{ cron: "17 9 4 * *" }]   # 4th of each month (World Bank updates on the 2nd business day)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl
      - run: python scripts/build_data.py
      - run: |
          git config user.name "data-bot"; git config user.email "data-bot@users.noreply.github.com"
          git add data.json scripts/cameco.csv; git diff --cached --quiet || git commit -m "Monthly data refresh"; git pull --rebase; git push
