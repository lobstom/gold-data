name: update-feeds
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_feeds.py feeds.json
      - run: |
          git config user.name "feeds-bot"; git config user.email "feeds-bot@users.noreply.github.com"
          git add feeds.json
          git diff --cached --quiet || (git commit -m "feeds update" && git push)
