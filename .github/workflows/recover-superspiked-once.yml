name: Recover Super-Spiked once
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feeds
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact QC-reviewed source-only recovery and remove this workflow
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYRECOVER'
          import os, subprocess, pathlib, hashlib, gzip, base64
          base = "9ad4d07a5faeb65ede44edda5c04a716d1cef2d7"
          workflow = ".github/workflows/recover-superspiked-once.yml"
          expected = os.environ["GITHUB_SHA"]
          run = lambda *args: subprocess.check_output(args, text=True).strip()
          assert run("git", "rev-parse", "HEAD") == expected
          assert run("git", "ls-remote", "origin", "refs/heads/main").split()[0] == expected
          assert run("git", "rev-parse", "HEAD^") == base
          assert run("git", "diff", "--name-only", base, "HEAD") == workflow
          sha = lambda b: hashlib.sha256(b).hexdigest()
          assert sha(pathlib.Path("feeds.json").read_bytes()) == "135561d24308a03ba2d65ad61598c32a827026b8d3136bdc692f78f82ce73565"
          assert sha(pathlib.Path("scripts/fetch_feeds.py").read_bytes()) == "3a8ea9b433027dbd15039e8b743700c68a11f9a21be5aa43c32e61d817715adf"
          data = gzip.decompress(base64.b64decode(""))
          parser = gzip.decompress(base64.b64decode(""))
          assert sha(data) == "1d259fb39223f05b248824c41d8267a419964a9e7a0e28d693d82ca0ab1cf371"
          assert sha(parser) == "d9236ac54faeb4fa39daf3f1ef58b45aaf1785d8119068836cdb5acfa089dc60"
          pathlib.Path("feeds.json").write_bytes(data)
          pathlib.Path("scripts/fetch_feeds.py").write_bytes(parser)
          pathlib.Path(workflow).unlink()
          assert set(run("git", "diff", "--name-only").splitlines()) == {"feeds.json", "scripts/fetch_feeds.py", workflow}
          subprocess.check_call(["git", "config", "user.name", "feeds-bot"])
          subprocess.check_call(["git", "config", "user.email", "feeds-bot@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "--", "feeds.json", "scripts/fetch_feeds.py", workflow])
          assert run("git", "ls-remote", "origin", "refs/heads/main").split()[0] == expected
          subprocess.check_call(["git", "commit", "-m", "Recover Super-Spiked articles and reject empty official feed"])
          subprocess.check_call(["git", "push", "origin", "HEAD:main"])
          print("Source-only recovery committed; temporary workflow removed.")
          PYRECOVER
