name: Publish exact QC-reviewed Nov16 snapshot
on:
  workflow_dispatch:
    inputs:
      expected_parent:
        description: Exact main HEAD containing this workflow, reviewed before dispatch
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Publish only exact reviewed files with race guards
        env:
          EXPECTED_PUBLICATION_PARENT: ${{ inputs.expected_parent }}
        run: |
          python - <<'PYCODE'
          import base64,zlib,json,pathlib,hashlib,subprocess,os
          R=pathlib.Path('.')
          run=lambda *x:subprocess.check_output(x,text=True).strip()
          assert run('git','branch','--show-current')=='main'
          assert not (R/'snapshots/2026-11-16.json').exists(), 'Delayed cron already published; abort'
          expected=os.environ['EXPECTED_PUBLICATION_PARENT']
          assert run('git','rev-parse','HEAD')==expected, 'main moved; abort for review'
          assert json.loads((R/'snapshots/latest.json').read_text())['snapshot_date']=='2026-11-09'
          assert hashlib.sha256((R/'data.json').read_bytes()).hexdigest()=='40a5144a55fbe9b02a13689ce078289690b846dfcfbd1c65eeb8fe6dd10d258f'
          payload=json.loads(zlib.decompress(base64.b64decode(''.join(line[10:] for line in pathlib.Path('.github/workflows/publish-reviewed-nov16.yml').read_text().splitlines() if line.startswith('# PAYLOAD ')))))
          expected_hashes={'data.json': 'f469479ea02ca56efc716f7c640d49d6994d2e971b34d5499d86311ff92ee7a1', 'snapshots/2026-11-16.json': 'cae42ac35c0d92d3cfb65ecb25b4aa3f900d7e7b6c8c1cec0732af96021e11b8', 'snapshots/latest.json': '5ba02aa82554c08aee2e7c703fd92e37cba0e6b10d73d98ec4393f1b03fbc9fc', 'reports/freshness.json': 'efd89d481ebd1c444521b2dfb5bc216490b9540a5910bb36a9a2ea5dc82ceba5', 'reports/freshness.md': '0667bdb46b0e7e158b02f9ed7f8412ace00596897a7095fdcde181e8dd407196', 'summary.json': '7f20e3719a8ca21ee44e477e9f5bf03c931586bcd8542f6f579ec3669dbfa557', 'summary.md': '8c7bc7cc2d637c7dd5f95ceeabd17631d286baad2c87274e4bb9694ef56fd4f2', 'scripts/build_summary.py': 'f0b435a46da9b65c0d91accf41b9d3d921911d86b6af23a81b3b9e8af6621b65'}
          for name,encoded in payload.items():
           b=base64.b64decode(encoded);assert hashlib.sha256(b).hexdigest()==expected_hashes[name]
           p=R/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          assert json.loads((R/'snapshots/latest.json').read_text())['snapshot_date']=='2026-11-16'
          subprocess.run(['git','config','user.name','data-bot'],check=True)
          subprocess.run(['git','config','user.email','data-bot@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+list(payload),check=True)
          assert set(run('git','diff','--cached','--name-only').splitlines())==set(payload)
          subprocess.run(['git','commit','-m','Publish QC-reviewed Nov 16 Monday snapshot'],check=True)
          # No rebase/retry/force. A concurrent main update makes this push fail closed.
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PYCODE

